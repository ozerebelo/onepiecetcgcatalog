# Supabase CLI configuration, used by `supabase start` / `supabase db start` /
# `supabase test db` for local development and CI.
# The hosted project's auth settings (site URL, redirect URLs, email
# confirmations) are configured in the Supabase dashboard — see docs/SETUP.md.
project_id = "playset"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
# Expo web dev server.
site_url = "http://localhost:8081"
additional_redirect_urls = ["http://localhost:8081/**", "http://localhost:8099/**", "playset://**", "exp://**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

# Branded auth emails. Locally they land in the test inbox (Mailpit, http://127.0.0.1:54324).
# The hosted project needs the same subjects and HTML pasted into the dashboard: docs/SETUP.md step 3.
[auth.email.template.confirmation]
subject = "Confirm your Playset email"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Playset password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirm your new Playset email"
content_path = "./supabase/templates/email_change.html"
