name: Update database & card data

# 1. Applies any new database migrations (supabase/migrations) — no SQL Editor needed.
# 2. Refreshes the card catalog from the official card list (via punk-records).
# 3. Copies new card images into Supabase Storage (needs the SUPABASE_SECRET_KEY secret).
#
# Runs every day, whenever migrations or the importer change on main, and on demand
# from the Actions tab ("Run workflow"). Secrets: see docs/SETUP.md.
on:
  schedule:
    - cron: '17 6 * * *' # daily, 06:17 UTC
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'packages/ingest/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only normalize and report, do not write to the database
        type: boolean
        default: false

concurrency:
  group: ingest-cards
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }} # optional: derived from DATABASE_URL
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$DATABASE_URL" ] && [ "${{ inputs.dry_run }}" != "true" ]; then
            echo "::warning::DATABASE_URL secret is not set; skipping. See docs/SETUP.md."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.config.outputs.skip != 'true'
      - uses: pnpm/action-setup@v6
        if: steps.config.outputs.skip != 'true'
      - uses: actions/setup-node@v7
        if: steps.config.outputs.skip != 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @binder/ingest...
        if: steps.config.outputs.skip != 'true'
      - name: Apply database migrations
        if: steps.config.outputs.skip != 'true' && inputs.dry_run != true
        run: pnpm db:migrate
      - name: Import cards and copy images
        if: steps.config.outputs.skip != 'true'
        run: pnpm ingest --fetch --mirror-images ${{ inputs.dry_run && '--dry-run' || '' }}
